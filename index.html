<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Debt Relief Solutions</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 40px auto; padding: 20px; }
        .box { background: #f4f4f4; padding: 20px; border-radius: 5px; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; padding: 12px; width: 100%; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>US Debt Relief & Settlement</h1>
    <p>Review restructuring programs available for US residents.</p>
    
    <div class="box">
        <h3>Check Your Qualification</h3>
        <form action="#" method="POST">
            <label>Estimated Debt Amount:</label>
            <select name="debt_amount">
                <option value="10k-20k">$10,000 - $20,000</option>
                <option value="20k-50k">$20,000 - $50,000</option>
                <option value="50k+">$50,000+</option>
            </select>

            <label>US Phone Number:</label>
            <input type="tel" name="phone" placeholder="(555) 000-0000" required>

            <button type="submit">See Relief Options</button>
        </form>
    </div>
</body>
</html>
