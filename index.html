<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Debt Relief & Settlement Solutions</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; color: #1e293b; max-width: 600px; margin: 40px auto; padding: 20px; background: #f8fafc; }
        .hero { background: #0f172a; color: white; padding: 30px; border-radius: 8px; }
        .form-box { background: white; border: 1px solid #cbd5e1; padding: 25px; border-radius: 8px; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
        select, input { width: 100%; padding: 12px; margin-bottom: 16px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        button { background: #2563eb; color: white; border: none; padding: 14px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <div class="hero">
        <h1>US Debt Relief & Settlement</h1>
        <p>Review restructuring programs available for US residents.</p>
    </div>

    <div class="form-box">
        <h3>Check Your Qualification</h3>
        
        <!-- LIVE FORM ENDPOINT -->
        <form action="https://formsubmit.co/bohlaletsinana@gmail.com" method="POST">
            
            <!-- Hidden configuration tags -->
            <input type="hidden" name="_subject" value="New US Debt Lead Captured!">
            <input type="hidden" name="_captcha" value="false">

            <label>Estimated Debt Amount:</label>
            <select name="debt_amount">
                <option value="10k-20k">$10,000 - $20,000</option>
                <option value="20k-50k">$20,000 - $50,000</option>
                <option value="50k+">$50,000+</option>
            </select>

            <label>US Phone Number:</label>
            <input type="tel" name="phone" placeholder="(555) 000-0000" required>

            <button type="submit">See Relief Options</button>
        </form>
    </div>

</body>
</html>
